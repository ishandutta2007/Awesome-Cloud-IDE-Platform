<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg)" rx="16" />

  <!-- Animated Floating Dynamic Elements (Background Waves & Orbs) -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="120" fill="#58a6ff">
      <animate attributeName="cy" values="80;110;80" dur="8s" repeatCount="indefinite" />
      <animate attributeName="r" values="120;135;120" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="280" r="140" fill="#bc8cff">
      <animate attributeName="cy" values="280;250;280" dur="10s" repeatCount="indefinite" />
      <animate attributeName="r" values="140;155;140" dur="10s" repeatCount="indefinite" />
    </circle>
    <path d="M-100 220 C 300 120, 700 300, 1300 180" stroke="url(#glow)" stroke-width="4" fill="none" opacity="0.6">
      <animate attributeName="d" values="M-100 220 C 300 120, 700 300, 1300 180; M-100 200 C 300 160, 700 260, 1300 200; M-100 220 C 300 120, 700 300, 1300 180" dur="12s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Dynamic Cloud Flow Nodes in Middle Ground -->
  <g stroke="#30363d" stroke-width="2" opacity="0.4">
    <line x1="200" y1="280" x2="350" y2="280" />
    <line x1="850" y1="280" x2="1000" y2="280" />
    <circle cx="200" cy="280" r="6" fill="#58a6ff" />
    <circle cx="350" cy="280" r="6" fill="#bc8cff" />
    <circle cx="850" cy="280" r="6" fill="#bc8cff" />
    <circle cx="1000" cy="280" r="6" fill="#3fb950" />
  </g>

  <!-- Foreground Title Card Container (Guarantees Text Visibility) -->
  <rect x="120" y="50" width="960" height="260" rx="16" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Top Decorative Accent Bar -->
  <rect x="120" y="50" width="960" height="6" rx="3" fill="url(#glow)" />

  <!-- Foreground Header Text & Subtitle -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="140" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="0.5">
      ☁️ Awesome Cloud IDE Platforms 🚀
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">
      A Curated List of SaaS Platforms, Remote Workspaces &amp; Open-Source Cloud IDEs
    </text>

    <!-- Tech Feature Pills in Foreground -->
    <g transform="translate(250, 220)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="36" rx="18" fill="#1f6feb" fill-opacity="0.2" stroke="#1f6feb" stroke-width="1.5" />
      <text x="90" y="23" fill="#58a6ff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚡ Remote Dev</text>

      <!-- Pill 2 -->
      <rect x="210" y="0" width="180" height="36" rx="18" fill="#8957e5" fill-opacity="0.2" stroke="#8957e5" stroke-width="1.5" />
      <text x="300" y="23" fill="#bc8cff" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">📦 Devcontainers</text>

      <!-- Pill 3 -->
      <rect x="420" y="0" width="180" height="36" rx="18" fill="#238636" fill-opacity="0.2" stroke="#238636" stroke-width="1.5" />
      <text x="510" y="23" fill="#3fb950" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">🌐 Web IDEs</text>
    </g>
  </g>
</svg>
